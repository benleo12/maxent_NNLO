[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "maxent_upgrade"
version = "1.1.0"
description = "Maximum-entropy moment matching: reweight positive-weight LO+PS event samples to reproduce NLO/NNLO moments, without negative weights"
readme = "README.md"
authors = [{name = "B. Assi"}]
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/benleo12/maxent_NNLO"

[tool.setuptools]
# the released moment tables live in moments/ at the repository root and are installed
# inside the package as maxent_upgrade/moments/
packages = ["maxent_upgrade", "maxent_upgrade.moments"]

[tool.setuptools.package-dir]
"maxent_upgrade.moments" = "moments"

[tool.setuptools.package-data]
"maxent_upgrade.moments" = ["*.json", "*.json.gz", "*.csv", "*.md"]
