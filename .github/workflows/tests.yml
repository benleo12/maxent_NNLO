name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    # Python 3.9 builds are available for this image, but not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,plot,hepmc]' ruff pycodestyle
      - name: Python syntax and undefined names
        # Preserve the byte-identical campaign source archive; check the public runners.
        run: ruff check --select F821 --extend-exclude 'examples/data/w_predictivity/study_record/**' maxent_upgrade examples tests
      - name: Tests
        run: python -m pytest -q tests
      - name: Previous implementation
        uses: actions/checkout@v7
        with:
          ref: 881fa39122a05f3b00d5962fa30b3b8a453e692b
          path: previous
      - name: Numerical compatibility
        run: python tests/compare_previous.py previous
      - name: Complete custom-process example and plot
        run: |
          python examples/custom_observables.py
          python examples/plot_result.py custom_result.npz mass --label Mass --unit GeV
          python examples/custom_uncertainties.py
          python examples/plot_result.py custom_bands.npz mass --label Mass --unit GeV
          python examples/plot_joint_validation.py
          python examples/real_drell_yan.py --output real_dy_check --bootstrap 2 --plot
          python examples/real_drell_yan.py --prior examples/data/herwig_public_prior.npz --output herwig_check --bootstrap 2 --plot
          python examples/plot_zj_benchmark.py --output zj_benchmark_check
          python examples/plot_zj_refinement.py --output zj_refinement_check
          python examples/plot_dy_portability.py --output dy_portability_check
          python examples/plot_w_joint.py --output w_joint_check --full-scans
          python examples/constraint_workflow.py constraint_workflow_check --stage train
          python examples/constraint_workflow.py constraint_workflow_check --stage validate
          python examples/w_constraint_workflow.py wp --output w_plus_study_check
          python examples/w_constraint_workflow.py wm --output w_minus_study_check
          python examples/plot_w_predictivity.py --output w_predictivity_plots_check
          python examples/paper_examples.py wp examples/data/w_predictivity/w_wp_prior.npz wp_check.npz
          python examples/paper_examples.py wm examples/data/w_predictivity/w_wm_prior.npz wm_check.npz
          python examples/application_demo.py ggh --output ggh_check --bootstrap 2 --plot
          python examples/application_demo.py aa --output aa_check --bootstrap 2 --plot
          python examples/application_demo.py zj --output zj_check --bootstrap 2 --plot
          maxent-upgrade histogram custom_bands.npz mass custom_cli_histogram.npz --bins 20 --range 60 140
      - name: Same recoil moments on two shower samples
        run: |
          maxent-upgrade fit examples/data/dy_prior.npz examples/own_prior/dy_recoil.json pythia_recoil.npz
          maxent-upgrade fit examples/data/herwig_public_prior.npz examples/own_prior/dy_recoil.json herwig_recoil.npz
          maxent-upgrade check herwig_recoil.npz
          python examples/own_prior/recoil_check.py pythia_recoil.npz herwig_recoil.npz
      - name: Installed command
        working-directory: /tmp
        run: |
          maxent-upgrade inspect dy
          maxent-upgrade inspect ggh
      - name: Formatting
        run: pycodestyle --max-line-length=100 --ignore=E501,E402,E731,W503,W504 --exclude=legacy.py,maxent_match.py,study_record maxent_upgrade examples
