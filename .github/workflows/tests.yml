name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    # Python 3.9 builds are available for this image, but not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,plot]' ruff pycodestyle
      - name: Python syntax and undefined names
        run: ruff check --select F821 maxent_upgrade examples tests
      - name: Tests
        run: python -m pytest -q tests
      - name: Previous implementation
        uses: actions/checkout@v7
        with:
          ref: 881fa39122a05f3b00d5962fa30b3b8a453e692b
          path: previous
      - name: Numerical compatibility
        run: python tests/compare_previous.py previous
      - name: Complete custom-process example and plot
        run: |
          python examples/custom_observables.py
          python examples/plot_result.py custom_result.npz mass --label Mass --unit GeV
          python examples/custom_uncertainties.py
          python examples/plot_result.py custom_bands.npz mass --label Mass --unit GeV
          maxent-upgrade histogram custom_bands.npz mass custom_cli_histogram.npz --bins 20 --range 60 140
      - name: Installed command
        working-directory: /tmp
        run: |
          maxent-upgrade inspect dy
          maxent-upgrade inspect ggh
      - name: Formatting
        run: pycodestyle --max-line-length=100 --ignore=E501,E402,E731,W503,W504 --exclude=legacy.py,maxent_match.py maxent_upgrade examples
